# yedai 設定範例。複製為 config.local.yaml 後修改（該檔名已被 gitignore）。
# 未列出的鍵會使用內建預設值。

# --- BM25F ---
k1: 1.2
b: 0.75

# 欄位權重。這些數字是猜的起點，實驗就是要用來修正它們。
field_weights:
  title: 3.0
  description: 2.0
  tags: 2.0
  headings: 1.5
  figures: 1.5
  body: 1.0

# --- 實體字典（模式 C）---
# 未提供時模式 C 退化為純 regex 抽取的識別碼匹配。
dictionary_path: dictionary.example.yaml

# CSV 實體來源。真實字典由 MES 匯出，是 CSV 不是 YAML；
# 要求維護者手工轉檔的結果就是字典會過期。可與上面的 YAML 並存。
#
# ⚠️ 真實清單屬敏感資料，請指向 *.local.csv（已被 gitignore）。
#    下面兩個 example 檔是**編造值**，只供驗證程式行為。
#
# schema:
#   id_only            單欄。值本身即正規名稱。含 `#` 的列自動歸入 child_type
#                      （機台與腔體同表，以 `#` 區分——這是資料的性質，不是偏好）
#   module_code_name   三欄 Module, defect code, defect name。
#                      code 全域唯一為正規名稱；name 為別名；Module 只是中繼資料。
#                      「微粒」「刮傷」這類一般詞正則抓不到，只有字典能對到 code。
entity_sources:
  - type: tool_id
    path: tools.example.csv
    schema: id_only
    child_type: chamber_id      # 選填，預設 chamber_id
  - type: defect_code
    path: defects.example.csv
    schema: module_code_name

entity_field_weights:
  title: 3.0
  description: 2.0
  tags: 2.0
  headings: 2.0
  figures: 1.5
  body: 1.0

# 開啟後模式 C 只回傳含查詢中「所有」實體的 concept。預設關閉。
require_entities: false

# --- 模式 C 的兩腿融合權重 ---
# 依討論結論偏向實體腿；改這裡就能做權重敏感度測試。
fusion_lexical: 0.4
fusion_entity: 0.6

# --- 識別碼樣式 ---
# 覆寫這份清單就會完全取代預設樣式。留空則沿用內建。
# identifier_patterns:
#   - 'cpt_[0-9A-Za-z]+'
#   - '[A-Za-z]{2,6}[-_]\d{1,5}'

# 格式樣本檔。`yedai check-formats` 會逐條檢查每個樣本是否被**整段**圈成
# 單一識別碼——被切成兩段的識別碼會失去鑑別力，讓模式 B 被低估。
#
# ⚠️ 樣本就是真實識別碼，屬敏感資料。請指向 *-samples.local.yaml（已被 gitignore）。
#    下面這個 example 檔是編造值，只用來驗證機制本身。
#
# 不設也能跑，但那等於沒有任何機制能發現「樣式對不上真實語料」——
# 而那正是這個實驗最容易靜默失效的地方。
identifier_samples_path: identifier-samples.example.yaml

# --- 資產 ---
# 允許透過 /concept/{id}/asset 讀取的目錄名稱。這是安全白名單：
# 只有位於這些名稱的目錄之下的檔案才取得到，其餘一律 403。
# 服務期政策，改了不需要重建索引。
asset_dirs:
  - _assets

# --- 索引 ---
# 具名索引集合。每個索引持有**完全獨立**的詞彙與實體統計：`df`、`avg_field_len`
# 與實體 idf 都不跨索引共用。
#
# 為什麼不是一個索引加個過濾條件：混在一起時統計是全域的，持續累積的那一層每長大
# 一次，其他層的排名就漂移一次——沒有變更、沒有測試會紅，品質卻退化了。過濾只影響
# 誰參與排序，碰不到 idf。
#
# 下面示範三層查案知識。真實的 source 路徑屬敏感資訊，請寫在 config.local.yaml。
indexes:
  # 缺陷登錄：人寫，每個 defect 一條。同時是實體字典的來源，因此其他層依賴它。
  library:
    source: ./corpus/library
    path: .index/library.pkl
    collection: yedai-library
    # description / when_to_use 不是註解，是執行期資料：它們會出現在 /v1/stats，
    # 並被組進 MCP search 工具的說明。索引名稱是任意鍵，agent 只看得到那個字串——
    # 沒有這兩句，它只能從名字猜這層是什麼。
    description: 缺陷登錄。人寫，每個 defect 一條，是實體字典的來源。
    when_to_use: 想知道「眼前這個東西叫什麼、它的權威定義是什麼」

  # 查案心法：自由文字、量大、無固定格式。查詢是敘述性的子查詢，
  # 識別碼在這一層是雜訊——比對一個跟問題無關的字串只會拉低結果。
  heuristics:
    source: ./corpus/heuristics
    path: .index/heuristics.pkl
    collection: yedai-heuristics
    depends_on: [library]
    keep_identifiers: false
    default_mode: D
    top_k: 5
    description: 查案心法。人寫，量大，無固定格式。
    when_to_use: 想知道「這類問題該從哪裡開始追」

  # 已結案：固定格式、持續累積。識別碼是主訊號，所以保留。
  cases:
    source: ./corpus/cases
    path: .index/cases.pkl
    collection: yedai-cases
    depends_on: [library]
    keep_identifiers: true
    default_mode: C
    top_k: 10
    description: 已結案的 defect report。固定格式、持續累積，識別碼是主訊號。
    when_to_use: 想知道「這個現象以前發生過什麼、最後查到哪裡」

# --- taxonomy 查表 ---
# defect → 判斷方法。以 defect 為鍵取回，**不進任何索引**：它是每個 defect 一條的
# 判斷方法，不是文件集合。放進倒排索引，呼叫端拿到的會是「最像的幾列」而且會很自信，
# 而拿錯 defect 的方法去解讀影像，比沒有方法更糟。
#
# 內容屬 fab 專有知識，請指向 taxonomy.local.yaml（已 gitignore）。
taxonomy_path: taxonomy.example.yaml

# defect 全集（defect → category）。taxonomy 覆蓋率的**分母**。
# 不設也能跑，但那樣只知道「整理了幾條」，不知道「還缺幾條」——而 taxonomy 是部分
# 填充的衍生欄位，缺口才是要追的東西。沒有分母時報告的 taxonomy.total 為 null。
#
# 真實清單屬 fab 專有知識，請指向 defects.catalogue.local.yaml（已 gitignore）。
defect_catalogue_path: defects.catalogue.example.yaml

# --- 路徑 ---
log_dir: logs

# --- 其他 ---
top_k: 10
# 固定隨機種子可讓三模式並排的呈現順序可重現（測試用）
seed: null
