# yedai 設定範例。複製為 config.local.yaml 後修改（該檔名已被 gitignore）。
# 未列出的鍵會使用內建預設值。

# --- BM25F ---
k1: 1.2
b: 0.75

# 欄位權重。這些數字是猜的起點，實驗就是要用來修正它們。
field_weights:
  title: 3.0
  description: 2.0
  tags: 2.0
  headings: 1.5
  figures: 1.5
  body: 1.0

# --- 實體字典（模式 C）---
# 未提供時模式 C 退化為純 regex 抽取的識別碼匹配。
dictionary_path: dictionary.example.yaml

# CSV 實體來源。真實字典由 MES 匯出，是 CSV 不是 YAML；
# 要求維護者手工轉檔的結果就是字典會過期。可與上面的 YAML 並存。
#
# ⚠️ 真實清單屬敏感資料，請指向 *.local.csv（已被 gitignore）。
#    下面兩個 example 檔是**編造值**，只供驗證程式行為。
#
# schema:
#   id_only            單欄。值本身即正規名稱。含 `#` 的列自動歸入 child_type
#                      （機台與腔體同表，以 `#` 區分——這是資料的性質，不是偏好）
#   module_code_name   三欄 Module, defect code, defect name。
#                      code 全域唯一為正規名稱；name 為別名；Module 只是中繼資料。
#                      「微粒」「刮傷」這類一般詞正則抓不到，只有字典能對到 code。
entity_sources:
  - type: tool_id
    path: tools.example.csv
    schema: id_only
    child_type: chamber_id      # 選填，預設 chamber_id
  - type: defect_code
    path: defects.example.csv
    schema: module_code_name

entity_field_weights:
  title: 3.0
  description: 2.0
  tags: 2.0
  headings: 2.0
  figures: 1.5
  body: 1.0

# 開啟後模式 C 只回傳含查詢中「所有」實體的 concept。預設關閉。
require_entities: false

# --- 模式 C 的兩腿融合權重 ---
# 依討論結論偏向實體腿；改這裡就能做權重敏感度測試。
fusion_lexical: 0.4
fusion_entity: 0.6

# --- 識別碼樣式 ---
# 覆寫這份清單就會完全取代預設樣式。留空則沿用內建。
# identifier_patterns:
#   - 'cpt_[0-9A-Za-z]+'
#   - '[A-Za-z]{2,6}[-_]\d{1,5}'

# 格式樣本檔。`yedai check-formats` 會逐條檢查每個樣本是否被**整段**圈成
# 單一識別碼——被切成兩段的識別碼會失去鑑別力，讓模式 B 被低估。
#
# ⚠️ 樣本就是真實識別碼，屬敏感資料。請指向 *-samples.local.yaml（已被 gitignore）。
#    下面這個 example 檔是編造值，只用來驗證機制本身。
#
# 不設也能跑，但那等於沒有任何機制能發現「樣式對不上真實語料」——
# 而那正是這個實驗最容易靜默失效的地方。
identifier_samples_path: identifier-samples.example.yaml

# --- 資產 ---
# 允許透過 /concept/{id}/asset 讀取的目錄名稱。這是安全白名單：
# 只有位於這些名稱的目錄之下的檔案才取得到，其餘一律 403。
# 服務期政策，改了不需要重建索引。
asset_dirs:
  - _assets

# --- 路徑 ---
index_path: .index/yedai.pkl
log_dir: logs

# --- 其他 ---
top_k: 10
# 固定隨機種子可讓三模式並排的呈現順序可重現（測試用）
seed: null
