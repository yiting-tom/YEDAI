# 識別碼格式樣本範例。
#
# ⚠️ 這裡的值全是**編造**的，只用來驗證機制本身。
#    真實樣本請寫進 `identifier-samples.local.yaml`（該樣式已被 gitignore）——
#    真實識別碼屬敏感資料，這個 repo 是公開的。
#
# 用途：`yedai check-formats -c config.local.yaml` 會逐條檢查每個樣本是否被
# **整段**圈成單一識別碼。被切成兩段的識別碼看起來「有被抓到」，但那正是
# 模式 B 失效的形式——所以部分涵蓋一律視為失敗。
#
# 每個類型放三到五筆就夠，重點是涵蓋**形狀的變體**（長短、有無後綴、大小寫），
# 不是涵蓋所有值。

tool_id:
  - aepol1
  - bcstd3
  - XTR-05
  - QW48F2         # 字母數字交錯、無分隔符——這種形狀不會被圈成識別碼，
  - ZTR07K         # 但仍是完整詞元（判定「完整詞元」），檢索不受損

chamber_id:
  - aepol1#pm1
  - XTR-05#PM1     # 父層含 `-`：曾經被咬成 ID:XTR05 + ID:PM1
  - QW48F2#3       # 子層是單一數字

tech:
  - Q16            # 前綴不固定、位數不固定，所以刻意沒有樣式；
  - q7             # 這兩筆都會是「完整詞元」，交給字典比正則精確

op_no:
  - "1234.000"
  - "234.000"
  - "98765.000"    # 5 碼：規格寫 3~4 碼，樣式照規格寫就會從中間咬進去

lot:
  - AB1234.00      # 小數點前 6 碼：跑完整 process flow 的量產批
  - AB12345.00     # 超過 6 碼：control wafer
  - QW123EXO4.00   # 更長、含字母

wafer:
  - AB1234.01
  - QW12EX34.01

# --- 以下類型目前沒有樣本，因為還沒有人提供真實格式 ---
#
# `check-formats` 會把它們列為「無樣本」。這不是疏漏，是**待補的缺口**：
# 在補上樣本之前，我們無法知道現有樣式對這些類型是否有效，
# 而「不知道」比「已知失效」危險——後者至少會被修。
#
# 補樣本的方式：把下面的類型取消註解，填入真實形狀（寫進 .local.yaml）。

# part6: []
# part7: []
# route: []
# stage: []
# subroute: []
# layer: []
# recipe: []
# drbl: []
