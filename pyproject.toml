[project]
name = "yedai-search"
version = "0.1.0"
description = "OKF bundle keyword-search baseline harness (A/B/C ablation + anonymised telemetry)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.12",
    "rich>=13.0",
    "mcp>=1.2",
    "qdrant-client>=1.18.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yedai"]

[project.scripts]
yedai = "yedai.cli:app"
